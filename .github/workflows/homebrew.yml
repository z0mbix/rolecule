name: Publish Homebrew formula

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_SSH_KEY:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing latest stable release to publish to the tap
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-rolecule
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'z0mbix/rolecule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate published stable release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName > release.json
          gh release view --json tagName > latest.json
          python3 - <<'PY'
          import json
          import os
          from scripts.homebrew_formula import validate_release

          with open("release.json") as source:
              release = json.load(source)
          with open("latest.json") as source:
              latest = json.load(source)["tagName"]
          publish = validate_release(os.environ["RELEASE_TAG"], release, latest)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"publish={str(publish).lower()}\n")
          if not publish:
              print("Prereleases leave the tap on the stable version")
          PY
      - name: Download published archives and checksums
        if: steps.release.outputs.publish == 'true'
        run: |
          gh release download "$RELEASE_TAG" --dir release \
            --pattern 'rolecule_*_darwin_*.tar.gz' \
            --pattern 'rolecule_*_linux_*.tar.gz' \
            --pattern 'rolecule_*_SHA256SUMS'
      - name: Check out the tap with its dedicated deploy key
        if: steps.release.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          repository: z0mbix/homebrew-tap
          ref: main
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
      - name: Verify archives and generate formula
        if: steps.release.outputs.publish == 'true'
        run: python3 scripts/homebrew_formula.py "$RELEASE_TAG" release homebrew-tap/Formula/rolecule.rb
      - name: Commit and publish formula
        if: steps.release.outputs.publish == 'true'
        shell: bash
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          git add Formula/rolecule.rb
          if git diff --cached --quiet; then
            echo "The tap already contains rolecule $RELEASE_TAG"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "rolecule $RELEASE_TAG"
          git pull --rebase origin main
          git push origin HEAD:main
